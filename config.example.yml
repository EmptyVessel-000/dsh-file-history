# 把这一段合并进 profile 的 cordis.patch.yml。
# 走 bundle 通道（dsh plugin add）时不需要手写这段，只在要改默认值时加。

- insert:
    - id: file-history
      name: 'dsh-file-history'
      config:
        # git 可执行文件路径。留空在 PATH 里找，也可用环境变量 DSH_FILE_HISTORY_GIT。
        gitPath: ''
        # 追加在默认排除清单之后的路径，写法同 .gitignore。
        excludes: []
        # 新会话树的默认值：每轮结束自动拍一份快照。关掉后只在设检查点时记录。
        auto: true
        # 单个文件的上限（字节）。超过的只统计数量，不存内容。
        maxFileBytes: 5242880
        # 工作区里自带 .git 的目录按文件展开；单个仓库的文件数超过这条线就整块不记。
        maxRepoFiles: 20000
        # 账本保留的轮次数，超出的旧轮次连同它的 git 引用一并裁剪。
        maxEntries: 100
        # 新会话树的默认值：凑够这么多个检查点时，倒数第 N 个之前的轮次删掉。
        pruneAfterCheckpoints: 2
        # 新会话树的默认值：最近多少轮一定留着。两项同时生效，都满足才留下。
        keepRecentTurns: 20
        # 单个目录的文件数超过这条线，整个目录不进快照。
        maxDirFiles: 20000
        # 整个工作区的字节数上限，超了从最大的文件开始让位。
        maxBytes: 2147483648
